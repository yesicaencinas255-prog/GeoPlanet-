<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoplanet - Bienvenido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('images/Code_Generated_Image.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 450%;
            max-width: 450px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.4));
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 200px;
        }

        .btn {
            display: block;
            text-align: center;
            text-decoration: none;
            width: 100%;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: rgba(220, 220, 220, 0.85);
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 1);
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="images/Logo.png" alt="Logo GeoPlanet" class="logo">

        <!-- Botones para Iniciar Sesión y Registro -->
        <div class="buttons-group">
            <a href="iniciarsesion.html" class="btn">Iniciar sesión</a>
            <a href="pantallaregistro.html" class="btn">Registrarse</a>
        </div>
    </div>

</body>
</html>
