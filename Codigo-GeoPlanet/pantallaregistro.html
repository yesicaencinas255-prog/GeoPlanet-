<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO Planet - Registro</title>
  <link rel="stylesheet" href="CSS/pantallaregistro.css">
  <!-- FUENTE GOOGLE FONTS (Fredoka) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="pant">
</head>
<body>
  
  <div class="pantalla" id="pantalla-registro">

    <!-- BARRA SUPERIOR ESTILO "PESTAÑAS" (GEO | Planet) -->
    <header class="barra-superior">
      <span class="pestana pestana-geo">GEO</span>
      <span class="pestana pestana-planet">Planet</span>
    </header>

    <!-- BOTÓN VOLVER ATRÁS (Redirige a entrada.html) -->
    <a href="entrada.html" class="btn-volver" id="btnVolver"><span class="flecha-volver"></span></a>

    <!-- CONTENEDOR CENTRAL DEL FORMULARIO -->
    <main class="contenedor-formulario">
      <form id="formRegistro" class="formulario" novalidate>

        <div class="grid-campos">

          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
          </div>

          <div class="campo">
            <label for="curso">Curso:</label>
            <input type="text" id="curso" name="curso">
          </div>

          <div class="campo">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido">
          </div>

          <div class="campo">
            <label for="gmail">Gmail:</label>
            <input type="email" id="gmail" name="gmail">
          </div>

          <div class="campo">
            <label for="password">Crear contraseña:</label>
            <input type="password" id="password" name="password">
          </div>

          <div class="campo">
            <label for="password2">Repetir contraseña:</label>
            <input type="password" id="password2" name="password2">
          </div>

        </div>

        <p id="mensaje" class="mensaje" style="color: red; text-align: center; margin-top: 10px;"></p>

        <!-- BOTÓN CREAR -->
        <div class="contenedor-boton-crear">
          <button type="submit" class="btn-crear" id="btnCrear">Crear</button>
        </div>

      </form>
    </main>

  </div>
<script src="JavaScript/pantallaregistro.js"></script>
  
</body>
</html>
