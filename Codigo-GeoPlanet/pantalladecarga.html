<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Adaptación responsiva para móviles y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando - GeoPlanet</title>
    <link rel="stylesheet" href="CSS/pantalladecarga.css">

    <!-- Fuente 'Quicksand' de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

 
</head>
<body>

    <main class="loading-container">

        <!-- Sección Central con el Planeta Principal -->
        <section class="main-content">
            <div class="planet-wrapper">
                <img src="imagenes/planeta.png" alt="Planeta GeoPlanet" class="main-planet">
            </div>
        </section>

        <!-- Sección de Carga (Barra + Planeta Pequeño + Texto) -->
        <section class="progress-section">
            
            <div class="progress-bar-container">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill"></div>
                </div>
                
                <div class="mini-planet-wrapper">
                    <img src="imagenes/planetacarga.png" alt="Planeta de Carga" class="mini-planet">
                </div>
            </div>

            <!-- Texto dinámico de carga -->
            <div class="loading-text-container">
                <p class="loading-text">
                    Cargando<span class="dots"><span>.</span><span>.</span><span>.</span></span>
                </p>
                <div class="sub-dots-loader">
                    <div class="sub-dot"></div>
                    <div class="sub-dot"></div>
                    <div class="sub-dot"></div>
                </div>
            </div>

        </section>

    </main>

  <script src="JavaScript/pantalladecarga.js"></script>
    
</body>
</html>
